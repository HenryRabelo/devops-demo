name: Build and Push Docker Images (GHCR)

on:
  workflow_dispatch:

jobs:

  call-docker-build:
    name: Build Docker Images
    uses: ./.github/workflows/docker-build.yml

  push-images-ghcr:
    name: Push Built Images to GHCR
    needs: call-docker-build
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Download Built Image Arteficts
        uses: actions/download-artifact@v7
        with:
          name: docker-built-images
          path: ${{ runner.temp }}/
          
      - name: Load Images on Docker Daemon
        run: |
          docker load --input ${{ runner.temp }}/python-client.tar
          docker load --input ${{ runner.temp }}/python-server.tar
          
      - name: Set Dynamic ENV Variables
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Transform names to lowercase
          ACTOR_LOWER=$(echo "$GITHUB_ACTOR" | tr '[:upper:]' '[:lower:]')
          REPO_OWNER_LOWER=$(echo "$GITHUB_REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          
          # Export transformed variables to global ENV
          echo "ACTOR_LOWER=$ACTOR_LOWER" >> "$GITHUB_ENV"
          echo "REPO_OWNER_LOWER=$REPO_OWNER_LOWER" >> "$GITHUB_ENV"
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Tag and Push Images to GitHub Container Registry
        run: |
          # Re-Tag images for push
          docker tag "local/python-client:v1" "ghcr.io/${{ env.REPO_OWNER_LOWER }}/python-client:v1"
          docker tag "local/python-server:v1" "ghcr.io/${{ env.REPO_OWNER_LOWER }}/python-server:v1"
          
          # Push to GitHub Container Registry using proper lowercase names
          docker push "ghcr.io/${{ env.REPO_OWNER_LOWER }}/python-client:v1"
          docker push "ghcr.io/${{ env.REPO_OWNER_LOWER }}/python-server:v1"